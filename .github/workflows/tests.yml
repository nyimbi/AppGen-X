name: Tests

# Runs the CI suite: `tests/ci`, the checks the repo actually maintains.
#
# This file used to be the untouched cookiecutter template. It installed
# Poetry, Nox and nox-poetry at pinned versions from 2022, drove every job
# through a `nox` session, and uploaded coverage with `actions/upload-artifact@v3`.
# That action is deprecated, so the runner failed each job at "Set up job"
# before a single step ran: 1,354 runs, zero successes, and no signal at all on
# any push. The repo's real toolchain is pip + pytest (see CLAUDE.md and the
# sibling workflows), so the template is replaced with that rather than repaired.
#
# The generated-app render gate is its own workflow (`generated-ui-render.yml`)
# because it needs Node and a Playwright browser; the render tests here
# `importorskip` Playwright, so they skip cleanly when it is absent.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: tests / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    env:
      PYTHONPATH: src
      # Any gate that walks a set needs a pinned hash seed, or it is noise.
      PYTHONHASHSEED: "0"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # `pyproject.toml` requires >=3.14.
          python-version: "3.14"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest

      - name: Run the CI suite
        run: python -m pytest tests/ci -v
