name: Studio Browser Smoke

on:
  push:
    paths:
      - "appgen-frontend/**"
      - "src/pyAppGen/studio_backend.py"
      - "src/pyAppGen/form_designer.py"
      - ".github/workflows/studio-browser-smoke.yml"
      - "pyproject.toml"
  pull_request:
    paths:
      - "appgen-frontend/**"
      - "src/pyAppGen/studio_backend.py"
      - "src/pyAppGen/form_designer.py"
      - ".github/workflows/studio-browser-smoke.yml"
      - "pyproject.toml"
  workflow_dispatch:

jobs:
  studio-browser-smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: appgen-frontend/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # `pyproject.toml` requires >=3.14. This pinned 3.11, so `pip install
          # -e .` failed here and every run of this workflow died before the
          # smoke it exists to run.
          python-version: "3.14"

      # The Studio's panels read the Python backend over `/api/studio/*`, so the
      # smoke runs both halves: `appgen studio-serve` serves the API and the
      # built frontend from one process, which is how the Studio actually runs.
      - name: Install the backend
        run: pip install -e .

      - name: Install frontend dependencies
        working-directory: appgen-frontend
        run: npm ci

      - name: Install the browser
        run: |
          python -m playwright install --with-deps chromium
          BROWSER_BIN="$(python - <<'PY'
          from playwright.sync_api import sync_playwright

          with sync_playwright() as playwright:
              print(playwright.chromium.executable_path)
          PY
          )"
          if [ ! -x "$BROWSER_BIN" ]; then
            echo "Playwright did not report a usable Chromium at '$BROWSER_BIN'." >&2
            exit 1
          fi
          echo "APPGEN_CHROME_BIN=$BROWSER_BIN" >> "$GITHUB_ENV"

      - name: Build Studio frontend
        working-directory: appgen-frontend
        run: npm run build

      - name: Run Studio browser smoke
        working-directory: appgen-frontend
        run: node scripts/browser-smoke.mjs

      - name: Upload Studio browser smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studio-browser-smoke-report
          path: appgen-frontend/browser-smoke-report.json
          if-no-files-found: ignore
